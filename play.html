<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003e7e">
  <title>Play | Trainer Trivia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Figtree:wght@400..800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/play.js"></script>
</head>
<body class="player">
  <header class="topbar">
    <a class="brand" href="index.html">Trainer Trivia</a>
    <div id="user-chip" class="user-chip" hidden>
      <img id="user-photo" class="avatar" alt="" referrerpolicy="no-referrer" hidden>
      <span id="user-name" class="user-name"></span>
      <button id="btn-signout" class="btn-link" type="button">Sign out</button>
    </div>
  </header>

  <!-- Everything below is drawn by js/play.js -->
  <main id="app">
    <div class="center-screen"><div class="spinner" aria-label="Loading"></div></div>
  </main>
</body>
</html>
