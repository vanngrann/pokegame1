<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#003e7e">
  <title>Host · Trainer Trivia</title>
  <link rel="stylesheet" href="css/styles.css">
  <script type="module" src="js/host.js"></script>
</head>
<body class="host">
  <header class="topbar">
    <a class="brand" href="index.html">Trainer Trivia</a>
    <div id="user-chip" class="user-chip" hidden>
      <img id="user-photo" class="avatar" alt="" referrerpolicy="no-referrer" hidden>
      <span id="user-name" class="user-name"></span>
      <button id="btn-signout" class="btn-link" type="button">Sign out</button>
    </div>
  </header>

  <!-- Everything below is drawn by js/host.js -->
  <main id="app">
    <div class="center-screen"><div class="spinner" aria-label="Loading"></div></div>
  </main>

  <footer class="footer">
    Fan-made and not affiliated with Nintendo, The Pokémon Company, Creatures or GAME FREAK.
  </footer>
</body>
</html>
